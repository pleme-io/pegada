[package]
name = "pegada"
version = "0.1.2"
edition = "2024"
rust-version = "1.89.0"
description = "Pegada — the footprint a lifecycle leaves where it stood, and the typed proof that it is gone. Membership recorded at create time and cross-checked by discovery; absence only as present-then-absent from a probe that answered; a Reaped value constructible only from proof that every owned member is gone."
homepage = "https://github.com/pleme-io/pegada"
repository = "https://github.com/pleme-io/pegada"
readme = "README.md"
license = "MIT"
categories = ["data-structures", "development-tools"]
keywords = ["kubernetes", "lifecycle", "footprint", "reaper", "typestate"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
kotae = "0.1.2"
tameshi = { version = "0.1.10", default-features = false, features = ["content-address"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
